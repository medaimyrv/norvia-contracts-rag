[alembic]
script_location = %(here)s/migrations
# Añade backend/ al sys.path para que env.py pueda importar el paquete app
prepend_sys_path = .
path_separator = os
# La URL no va aquí [S2]: migrations/env.py la toma de DATABASE_URL (o de los tests)

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
