# Arranque: `docker compose up --build` [R14].
# Los valores ${VAR:-defecto} se leen de .env si existe; sin .env funciona igual (modo fake, sin claves).

name: norvia

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-norvia}:${POSTGRES_PASSWORD:-norvia}@postgres:5432/${POSTGRES_DB:-norvia}
  REDIS_URL: redis://redis:6379/0
  MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini/gemini-embedding-001}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-30}
  RETRIEVAL_K: ${RETRIEVAL_K:-6}
  RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  UPLOAD_DIR: /data/uploads
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-norvia-rag}
  OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
  OTEL_CAPTURE_CONTENT: ${OTEL_CAPTURE_CONTENT:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Evita que LiteLLM cargue por su cuenta un .env al importarse (solo configuración explícita)
  LITELLM_MODE: PRODUCTION

x-backend: &backend
  build: ./backend
  image: norvia-rag-backend:local
  environment: *backend-env
  volumes:
    - uploads:/data/uploads   # la API escribe el PDF y el worker lo lee
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg17   # incluye pgvector >= 0.8 (hnsw.iterative_scan, D14)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-norvia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-norvia}
      POSTGRES_DB: ${POSTGRES_DB:-norvia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Aplica las migraciones y termina; api y worker esperan a que acabe bien [R7]
  migrate:
    build: ./backend
    image: norvia-rag-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      # python-slim no trae curl: se usa urllib de la librería estándar
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Carga inicial: sube por la API los PDFs seed=true de samples/ y termina [R14].
  # Idempotente: en arranques posteriores recibe 200 (ya existía) en vez de 202
  seed:
    image: norvia-rag-backend:local
    command: ["python", "-m", "scripts.seed", "--api", "http://api:8000", "--samples", "/samples"]
    volumes:
      - ./samples:/samples:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  uploads:
